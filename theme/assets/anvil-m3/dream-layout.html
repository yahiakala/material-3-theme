<!-- Navigation Area -->
<div anvil-name="anvil-m3-dream-nav" class="anvil-m3-dream-nav">
  <div class="anvil-m3-dream-nav-content" anvil-slot="anvil-m3-dream-nav-content">
    <p anvil-if-slot-empty="anvil-m3-dream-nav-content" class="anvil-designer-only" style="font-style: italic;">Add navigation links here</p>
  </div>
</div>

<!-- Top App Bar -->
<div anvil-name="anvil-m3-dream-top-bar" class="anvil-m3-dream-top-bar">
  <div class="anvil-m3-dream-title-container">
    <div anvil-name="anvil-m3-dream-menu-btn" class="anvil-m3-dream-menu-btn">
      <span class="material-symbols-outlined">menu</span>
    </div>
    <div anvil-slot="anvil-m3-dream-app-title" class="anvil-m3-dream-app-title">
      <span anvil-if-slot-empty="anvil-m3-dream-app-title" class="anvil-designer-only" style="font-style: italic;">Drop optional title here</span>
    </div>
  </div>
  <div class="anvil-m3-dream-app-bar-links" anvil-slot="anvil-m3-dream-app-bar-links">
    <span anvil-if-slot-empty="anvil-m3-dream-app-bar-links" class="anvil-designer-only" style="font-style: italic;">Drop optional icon buttons here</span>
  </div>
</div>

<!-- Scrim for Mobile Navigation -->
<div anvil-name="anvil-m3-dream-scrim" class="anvil-m3-dream-scrim"></div>

<!-- Main Content Area -->
<div class="anvil-m3-dream-content" anvil-slot="anvil-m3-dream-content" anvil-name="anvil-m3-dream-content">
  <p anvil-if-slot-empty="anvil-m3-dream-content" class="anvil-designer-only" style="font-style: italic;">Add content here</p>
</div>
